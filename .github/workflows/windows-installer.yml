# Сборка Windows-установщика (Inno Setup) — он умеет спрашивать, куда ставить.
# Inno работает только на Windows, поэтому собираем на windows-раннере.
name: Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия, например 1.0.1"
        required: true
        default: "1.0.1"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Публикация приложения
        working-directory: iHateCards.NET
        run: |
          dotnet publish src/iHateCards/iHateCards.csproj -c Release -r win-x64 --self-contained `
            -o publish/win-x64 -p:Version=${{ inputs.version }} -p:InformationalVersion=${{ inputs.version }}
          Remove-Item publish/win-x64/*.pdb -ErrorAction SilentlyContinue

      - name: Сборка установщика (обычный, с версией внутри)
        working-directory: iHateCards.NET
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=${{ inputs.version }} installer\iHateCards.iss

      - name: Сборка веб-установщика (скачивает latest при запуске)
        working-directory: iHateCards.NET
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\iHateCards-web.iss

      - uses: actions/upload-artifact@v4
        with:
          name: iHateCards-setup-${{ inputs.version }}
          path: iHateCards.NET/publish/*setup.exe
